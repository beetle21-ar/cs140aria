<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up Example</title>
    <link rel="stylesheet" href="form.css">
</head>
<body>
    <header class="header">
        <h1>Aria Wirastyo's Design</h1>
    </header>
    <nav class="navbar">
        <a href="#home">Home</a>
        <a href="#Form">Form</a>
        <a href="#contact">Contact</a>
    </nav>
    <div class="content-container">
        <main class="main-content">
            <h2 id="form" class="main-title">Form</h2>
            <form action="formprocessing.html" method="post" class="form-configuration">
                
                <fieldset class="fieldset">
                    <legend>account</legend>
                    <div class="form-row">
                        <label for="username">Username</label>
                        <input type="text" name="username" id="username" placeholder="username">
                    </div>
                    <div class="form-row">
                        <label for="email">email</label>
                        <input type="email" name="email" id="email" placeholder="email">
                    </div>
                    <div class="form-row">
                        <label for="password">password</label>
                        <input type="password" name="password" id="password" placeholder="password">
                    </div>  
                </fieldset>
                <fieldset class="fieldset">
                    <legend>About you</legend>
                    <div class="form-row">
                        <label for="about">About</label>
                        <textarea name="about" id="about" placeholder="Write your interest"></textarea>
                    </div>
                    <div class="form-row">
                        <label for="date">Birthday</label>
                        <input type="date" name="date" id="date">
                    </div>
                    <div class="form-row">
                        <label for="type-phone-number">Type of your phone number:</label>
                        <select name="type-phone-number" id="type-phone-number">
                            <option value="unset" disabled selected hidden>choose an option</option>
                            <option value="Home">Home</option>
                            <option value="Work">Work</option>
                            <option value="Personal">Personal</option>
                        </select>
                    </div>
                    <div class="form-row">
                        <label for="phone-number">Phone Number</label>
                        <input type="tel" name="tel-number" id="phone-number">
                    </div>
                    <div class="form-row">
                        <div>
                        <p>Gender:</p>
                            <div class="form-spacer">
                                <label for="male">
                                    <input type="radio" id="male" name="gender" value="male">Male
                                </label>
                                <label for="female">
                                    <input type="radio" id="female" name="gender" value="female">Female
                                </label>
                            </div>
                        </div>
                    </div>
                    <div class="form-row">
                        <div>
                            <p>If you need to save your info:</p>
                            <div class="form-spacer">
                                <label for="remember"><input type="checkbox" name="agree" id="remember" value="yes"> remember me</label>
                            </div>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-spacer">
                                <label for="TnC"><input type="checkbox" name="TnC" id="TnC" value="yes" required> Agree with <a href="#">Terms & Conditions</a></label>
                            </div>
                    </div>
                </fieldset>
                <div class="form-row">
                    <input type="submit">  
                </div>
            </form>
        </main>
    </div>
    <footer class="footer">
        <p>&copy; 2026 Aria Wirastyo</p>
    </footer>
</body>
</html>
